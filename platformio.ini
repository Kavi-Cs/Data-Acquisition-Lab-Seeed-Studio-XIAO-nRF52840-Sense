; PlatformIO Project Configuration File
;
; Seeed Studio XIAO nRF52840 Sense - constant-rate ADC sampling firmware.
;
; IMPORTANT: `board` below is the most likely PlatformIO board ID for this
; module (the XIAO nRF52840 Sense ships on the Adafruit nRF52 Arduino
; core under the hood). This could not be verified against the live
; PlatformIO board registry from the environment this repository was
; generated in. Before your first build, confirm it with:
;
;     pio boards | grep -i xiao
;
; and update [env:xiao_nrf52840_sense] -> board= if the listed ID differs.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = xiao_nrf52840_sense
src_dir = firmware/src
include_dir = firmware/include

[env:xiao_nrf52840_sense]
platform = nordicnrf52
board = seeed_xiaoblesense      ; <-- verify, see note above
framework = arduino

; USB CDC serial, matches Serial.begin(115200) in sampling.cpp
monitor_speed = 115200
monitor_filters = default, time

; The firmware talks to NRF_TIMER3 / NRF_SAADC directly via CMSIS
; register access, so no extra DSP/ADC library is required - only the
; TinyUSB-based CDC stack used by Serial on this core.
lib_deps =
    adafruit/Adafruit TinyUSB Library @ ^3.1.4

build_flags =
    -Wall
    -Wextra
    -DFW_BUILD_ENV=\"xiao_nrf52840_sense\"

; Uncomment and set explicitly if auto-detection ever picks the wrong
; port (e.g. multiple boards attached):
; upload_port = /dev/ttyACM0
; monitor_port = /dev/ttyACM0
